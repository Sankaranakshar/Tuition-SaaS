name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Non-blocking by design: 17 pre-existing high/moderate advisories remain
      # after `npm audit fix` (safe, in-range) already ran (was 22). The rest
      # need major-version bumps (vite, react-router-dom) or a downgrade
      # (exceljs, to fix a transitive uuid advisory) — all genuine breaking
      # changes, not something CI should force or silently accept. This step
      # keeps the report visible on every run without failing the build until
      # someone makes the call to take the breaking upgrade.
      - name: Dependency audit (report only, see comment above)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Whole unit suite under UTC, Asia/Kolkata and America/New_York: C-01
      # requires it to pass identically under any process timezone.
      - name: Unit tests (three timezones)
        run: npm run test:tz

      - name: RLS/RBAC tests
        run: npm run test:rls

      - name: Route-contract tests
        run: npm run test:contract

      - name: Build (SPA + local/traditional-host server bundle)
        run: npm run build

      - name: Bundle size check
        run: npm run check:bundle-size

      # Builds the SAME artifact Vercel's buildCommand produces (server/vercelHandler.ts
      # -> api/index.js), not dist/server.js from the step above — those are two
      # different bundles from two different entry points. Without this, CI can be
      # fully green while the actual deployed function is stale or broken (see
      # docs/OPTIMIZATION_AUDIT.md finding C1: the committed api/index.js was once 15
      # days stale and silently missing 7 of 14 route groups).
      - name: Build Vercel API bundle
        run: npm run build:api

      - name: Verify API bundle has every route mount
        run: npm run check:api-bundle

  # The eighth gate (EXECUTION_PLAN.md Step 31): Playwright golden journeys plus
  # automated axe checks, driving this commit's own production build in
  # Chromium against the classstackr-staging Supabase project. Runs alongside
  # build-and-test rather than after it. See Step 31's "Decisions" for why it
  # builds and serves the app here instead of testing the Vercel Preview URL.
  e2e:
    name: E2E (Playwright + axe, staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same PR supersedes a run in progress. A cancelled
    # run skips its teardown; the next run's global setup sweeps anything
    # suite-made that is over two hours old.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      # All four come from classstackr-staging and live only in GitHub
      # Actions secrets (repo Settings -> Secrets and variables -> Actions).
      # GitHub does not expose them to pull requests from forks.
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check staging secrets are configured
        run: |
          missing=""
          for name in SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing staging secrets for:$missing. Add STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SUPABASE_SERVICE_ROLE_KEY and STAGING_DATABASE_URL (see HANDOFF.md §4)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Vite bakes VITE_* into the bundle at build time, so this build (unlike
      # build-and-test's) is the staging-wired SPA the journeys drive.
      - name: Build SPA against staging
        run: npx vite build

      - name: Playwright golden journeys
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
